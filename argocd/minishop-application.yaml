apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minishop
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/TechWorld707/minishop-gitops.git
    targetRevision: main
    path: apps/minishop
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      