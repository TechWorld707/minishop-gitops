apiVersion: v1
kind: ServiceAccount
metadata:
  name: minishop-reader
  namespace: prod

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minishop-reader
  namespace: prod
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minishop-reader
  namespace: prod
subjects:
  - kind: ServiceAccount
    name: minishop-reader
    namespace: prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: minishop-reader